kind = "web"
previewPath = "/"
title = "FutureReady"
description = "FutureReady helps users explore career options, understand skill gaps, and plan learning pathways using occupation references and labour-market data."
version = "1.0.0"
id = "artifacts/future-ready-workforce"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22019

[services.development]
run = "pnpm --filter @workspace/future-ready-workforce run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/future-ready-workforce", "run", "build" ]
serve = "static"
publicDir = "artifacts/future-ready-workforce/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22019"
BASE_PATH = "/"
