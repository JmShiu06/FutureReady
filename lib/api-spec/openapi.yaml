openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Dataset-based career skill matching
  - name: dosm
    description: Official DOSM labour-force and Job Market Insights data
  - name: occupations
    description: Reviewed MyCOL occupations and O*NET skill evidence
  - name: ai
    description: Optional Runpod vLLM explanations for user-requested task exposure
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /career/skills:
    get:
      operationId: listCareerSkills
      tags: [career]
      summary: List skills known to the career dataset
      description: Returns every distinct normalized skill name in the role-to-skill dataset.
      responses:
        "200":
          description: Skill names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSkillList"
  /career/cv-skills:
    post:
      operationId: extractCvSkills
      tags: [career]
      summary: Extract dataset skills, a likely CV name, and labelled profile details from an in-memory CV
      description: PDF, DOCX, UTF-8 TXT, JPG, JPEG or PNG, at most 5 MB. Scanned PDFs and image uploads use local offline OCR. Exact skill names and reviewed related phrases are suggested for review; a short name is detected from an explicitly labelled name or likely header line, and other profile details are returned only when explicitly labelled in the CV. No file or raw text is retained or sent to external services.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CvUploadInput"
      responses:
        "200":
          description: Detected skills and explicitly labelled profile details for user review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvSkillExtraction"
        "400":
          description: Missing, malformed or unsupported file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File or expanded document exceeds the processing limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No readable text could be recognized; retry with a clearer file or enter skills manually
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Extraction capacity is busy; retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/cv-career-explanation:
    post:
      operationId: generateCvCareerExplanation
      tags: [ai]
      summary: Explain reviewed skill names and language names after explicit consent
      description: Uses only reviewed structured fields, never a CV file or full document text. Transient, no-store, rate limited. Matching scores and learning resources are supplied by the server, not generated by AI.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CvCareerExplanationInput"
      responses:
        "200":
          description: Seven qualitative explanation sections with deterministic matches and verified resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvCareerExplanation"
        "400":
          description: Invalid reviewed CV details or missing consent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Model unavailable or unsupported output
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI service busy or not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/cv-match:
    post:
      operationId: matchCvCareers
      tags: [career]
      summary: Match uploaded-dataset career titles using existing skill references
      description: >
        Career names come only from the user-supplied AI Job Market Dataset job_title column.
        Each title uses an explicitly identified existing 30-skill reference family.
        Pooled references can produce equal scores; CSV salary, openings and skill flags are not used.
        The general career matching endpoint and DOSM evidence are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerSkillsInput"
      responses:
        "200":
          description: Ranked uploaded-dataset career names with mapped skill references
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerMatchResult"
        "400":
          description: Invalid skills input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/match:
    post:
      operationId: matchCareers
      tags: [career]
      summary: Rank role families by dataset skill overlap
      description: >
        Compares the supplied profile skills with each role family's 30 listed
        skills using exact names and a small reviewed set of related phrase
        aliases. The response identifies exact versus related mappings.
        Score = matched dataset skills / 30 x 100.
        This is dataset skill overlap, not a probability of employment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerSkillsInput"
      responses:
        "200":
          description: Ranked role families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerMatchResult"
        "400":
          description: Invalid skills input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai/explanations:
    post:
      operationId: createAiExplanation
      tags: [ai]
      summary: Explain a synthetic example or one CV-detected skill
      description: >
        For general features, accepts a fixed synthetic sample ID and optional evidence selectors. CV Analysis
        accepts only one skill name returned by the CV detector and chosen in the review UI. The uploaded file,
        extracted text, proficiency, other detected skills and saved profile are never sent. Context is built
        on the server. Qwen thinking mode is disabled and responses with reasoning traces are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AiExplanationInput"
      responses:
        "200":
          description: Qualitative model explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiExplanation"
        "400":
          description: Invalid feature, sample, CV skill or evidence selector
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Selected evidence is missing or unsupported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: AI explanation rate limit reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Runpod did not return a usable explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Runpod is not configured or temporarily busy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /analyze-resume:
    post:
      operationId: analyzeResume
      tags: [career]
      summary: Analyze resume text using local deterministic skill detection
      description: >
        Uses exact skill names and a small reviewed set of related phrase mappings
        with the bundled role-skill dataset. Resume text is processed in memory and
        is not retained or sent to external services. This endpoint does not run an
        ML model or generate a validated readiness score.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeTextInput"
      responses:
        "200":
          description: Detected skills and available profile suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResumeAnalysisReport"
        "400":
          description: Invalid resume text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /skill-gap-analysis:
    post:
      operationId: analyzeSkillGap
      tags: [career]
      summary: Compare resume skills with one bundled role family
      description: >
        Returns exact and reviewed related-skill overlap and missing role skills,
        with resources from a small reviewed catalog of official provider courses.
        Skills with no verified resource are explicitly identified by the empty
        catalog status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillGapAnalysisInput"
      responses:
        "200":
          description: Dataset-based role skill gap
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillGapAnalysisReport"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Target role is not present in the bundled dataset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career-path:
    post:
      operationId: analyzeCareerPath
      tags: [career]
      summary: Rank role families and list illustrative next skills
      description: >
        Uses deterministic skill matching with exact names and reviewed related
        phrase mappings. The score is not a confidence score, suitability
        prediction, or employment probability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeTextInput"
      responses:
        "200":
          description: Ranked dataset role families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerPathAnalysisReport"
        "400":
          description: Invalid resume text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /profile-similarity:
    post:
      operationId: analyzeProfileSimilarity
      tags: [career]
      summary: Return available profile-similarity information
      description: >
        The bundled dataset contains role skill lists but no candidate profiles.
        The endpoint therefore returns no similar profiles and explains the
        limitation rather than fabricating peer records.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResumeTextInput"
      responses:
        "200":
          description: Similarity result with data-availability limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileSimilarityReport"
        "400":
          description: Invalid resume text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List job listings
      parameters:
        - $ref: "#/components/parameters/JobPage"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobKeyword"
        - $ref: "#/components/parameters/JobMinimumSalary"
        - $ref: "#/components/parameters/JobMaximumSalary"
        - $ref: "#/components/parameters/JobState"
        - $ref: "#/components/parameters/JobCity"
        - $ref: "#/components/parameters/JobRemote"
        - $ref: "#/components/parameters/JobEmploymentType"
        - $ref: "#/components/parameters/JobSort"
      responses:
        "200":
          description: Paginated job listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/search:
    get:
      operationId: searchJobs
      tags: [jobs]
      summary: Search jobs by title, company, or skills
      parameters:
        - $ref: "#/components/parameters/JobPage"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobSearchKeyword"
        - $ref: "#/components/parameters/JobMinimumSalary"
        - $ref: "#/components/parameters/JobMaximumSalary"
        - $ref: "#/components/parameters/JobState"
        - $ref: "#/components/parameters/JobCity"
        - $ref: "#/components/parameters/JobRemote"
        - $ref: "#/components/parameters/JobEmploymentType"
        - $ref: "#/components/parameters/JobSort"
      responses:
        "200":
          description: Paginated matching listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          description: Invalid search filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/filter:
    get:
      operationId: filterJobs
      tags: [jobs]
      summary: Filter jobs by salary, location, and employment type
      parameters:
        - $ref: "#/components/parameters/JobPage"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobKeyword"
        - $ref: "#/components/parameters/JobMinimumSalary"
        - $ref: "#/components/parameters/JobMaximumSalary"
        - $ref: "#/components/parameters/JobState"
        - $ref: "#/components/parameters/JobCity"
        - $ref: "#/components/parameters/JobRemote"
        - $ref: "#/components/parameters/JobEmploymentType"
        - $ref: "#/components/parameters/JobSort"
      responses:
        "200":
          description: Paginated filtered listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/match-score:
    post:
      operationId: calculateJobMatchScores
      tags: [jobs]
      summary: Calculate profile skill overlap for job listings
      description: Exact normalized skill-name overlap. This is not a hiring probability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobMatchInput"
      responses:
        "200":
          description: Match scores for the requested jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMatchScores"
        "400":
          description: Invalid match request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dosm/labour-force:
    get:
      operationId: getDosmLabourForce
      tags: [dosm]
      summary: Get validated monthly labour-force observations from OpenDOSM
      description: National labour-force context only; these observations are not occupation or skill-demand data.
      parameters:
        - name: fromMonth
          in: query
          required: false
          description: Inclusive month filter in YYYY-MM format.
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
        - name: toMonth
          in: query
          required: false
          description: Inclusive month filter in YYYY-MM format.
          schema:
            type: string
            pattern: "^[0-9]{4}-(0[1-9]|1[0-2])$"
      responses:
        "200":
          description: Validated monthly observations and source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosmLabourForceResponse"
        "400":
          description: Invalid month range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: OpenDOSM is unavailable and no usable cached copy exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dosm/occupation-employment-search:
    get:
      operationId: getDosmOccupationEmploymentSearch
      tags: [dosm]
      summary: Search MASCO group employment with national DOSM context
      description: Search a reviewed subset of Malaysian occupation titles and return the corresponding 2024 DOSM major-group employment count plus separate current national labour-force indicators. No occupation-specific unemployment count or rate is implied.
      parameters:
        - name: q
          in: query
          required: false
          description: Optional job-title or occupation-group keyword, up to 100 characters.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Matched broad occupational groups and the latest national labour-force context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosmOccupationEmploymentSearchResponse"
        "400":
          description: Invalid occupation keyword
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: OpenDOSM is unavailable and no usable cached copy exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dosm/job-market-insights:
    get:
      operationId: getDosmJobMarketInsights
      tags: [dosm]
      summary: Get the latest validated DOSM major-occupation-group snapshot
      description: Counts are online job offerings, not a complete vacancy count or skill-demand measure.
      responses:
        "200":
          description: Reviewed occupation-group counts with report and terms links
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosmJobMarketInsightsResponse"
  /dosm/job-market-insights/refresh:
    post:
      operationId: refreshDosmJobMarketInsights
      tags: [dosm]
      summary: Retrieve the latest available quarterly DOSM JMI workbook
      responses:
        "200":
          description: Official workbook retrieved and validated; cached data replaced atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosmJobMarketInsightsResponse"
        "502":
          description: Refresh failed; previous snapshot retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /dosm/refresh:
    post:
      operationId: refreshDosmLabourForce
      tags: [dosm]
      summary: Force a refresh of the monthly OpenDOSM labour-force dataset
      description: Refreshes only the OpenDOSM monthly series; the reviewed quarterly JMI workbook snapshot is not refreshed.
      responses:
        "200":
          description: OpenDOSM data was retrieved, validated and cached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DosmRefreshResponse"
        "502":
          description: OpenDOSM refresh failed; any previous cached copy is retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals/ai-capabilities:
    get:
      operationId: getAiCapabilities
      tags: [signals]
      summary: Get bounded public AI capability feed with last validated durable fallback
      responses:
        "200":
          description: Validated source facts, not a job-loss forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCapabilityFeed"
  /signals/ai-capabilities/refresh:
    post:
      operationId: refreshAiCapabilities
      tags: [signals]
      responses:
        "200":
          description: Refreshed feed or explicit last validated fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCapabilityFeed"
  /signals/ai-announcements:
    get:
      operationId: getAiAnnouncements
      tags: [signals]
      summary: AI-related Ministry of Digital press releases
      description: Qualitative, dated announcements read from the public listing page. Not skill-demand data.
      responses:
        "200":
          description: Announcements with source, retrieval time and staleness
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnnouncementsResponse"
        "502":
          description: Source unavailable and no earlier copy exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals/ai-announcements/refresh:
    post:
      operationId: refreshAiAnnouncements
      tags: [signals]
      summary: Re-request the Ministry of Digital listing
      responses:
        "200":
          description: Announcements were retrieved and parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnnouncementsResponse"
        "502":
          description: Refresh failed; any earlier copy is retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /signals/skill-frequencies:
    get:
      operationId: getSkillFrequencies
      tags: [signals]
      summary: Qarera global job-posting skill frequencies by role family
      responses:
        "200":
          description: Top skills per role family with source and limitations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillFrequenciesResponse"
  /occupations/match:
    post:
      operationId: matchOccupationEvidence
      tags: [occupations]
      summary: Compare profile skills with O*NET skills for mapped MyCOL critical occupations
      description: >
        Returns reviewed MyCOL 2024/2025 occupations, their MASCO-to-O*NET mappings and
        O*NET 31.0 skills documented for each mapped occupation, with exact normalized overlap
        against the supplied skills. MyCOL status is a TalentCorp classification and O*NET is
        United States reference data; neither is a hiring probability or a measure of Malaysian
        demand. Unverified mappings and occupations without O*NET skill ratings are excluded
        from recommendations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OccupationSkillsInput"
      responses:
        "200":
          description: Occupation evidence with source metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupationEvidenceResult"
        "400":
          description: Invalid skills input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    JobPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    JobLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    JobKeyword:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    JobSearchKeyword:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    JobMinimumSalary:
      name: minSalary
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    JobMaximumSalary:
      name: maxSalary
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    JobState:
      name: state
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    JobCity:
      name: city
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    JobRemote:
      name: remote
      in: query
      required: false
      schema:
        type: boolean
    JobEmploymentType:
      name: employmentType
      in: query
      required: false
      schema:
        type: string
        enum: [full-time, part-time, contract, internship]
    JobSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, recent]
        default: recent
  schemas:
    AiCapabilityFact:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        url: { type: string, format: uri }
        publishedOn: { type: string }
        capability: { type: string, enum: [coding, reasoning, safety] }
      required: [title, summary, url, publishedOn, capability]
    AiCapabilityFeed:
      type: object
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AiCapabilityFact" }
        retrievedAt: { type: [string, "null"] }
        isStale: { type: boolean }
        warning: { type: [string, "null"] }
        changeSummary: { type: string }
        sourceUrl: { type: string, format: uri }
      required: [items, retrievedAt, isStale, warning, changeSummary, sourceUrl]
    AiAnnouncement:
      type: object
      properties:
        title: { type: string }
        publishedOn: { type: string, format: date }
        category: { type: [string, "null"] }
        url: { type: string, format: uri }
        source: { type: string }
      required: [title, publishedOn, category, url, source]
    AiAnnouncementsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AiAnnouncement"
        source:
          type: object
          properties:
            name: { type: string }
            listingUrl: { type: string, format: uri }
          required: [name, listingUrl]
        retrievedAt: { type: string, format: date-time }
        isStale: { type: boolean }
        warning: { type: [string, "null"] }
        limitations:
          type: array
          items: { type: string }
      required: [items, source, retrievedAt, isStale, warning, limitations]
    SkillFrequency:
      type: object
      properties:
        skill: { type: string }
        postingsWithSkill: { type: integer, minimum: 0 }
        percentOfRolePostings: { type: number, minimum: 0, maximum: 100 }
      required: [skill, postingsWithSkill, percentOfRolePostings]
