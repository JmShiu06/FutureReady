openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: career
    description: Dataset-based career skill matching
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /career/skills:
    get:
      operationId: listCareerSkills
      tags: [career]
      summary: List skills known to the career dataset
      description: Returns every distinct normalized skill name in the role-to-skill dataset.
      responses:
        "200":
          description: Skill names
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerSkillList"
  /career/cv-skills:
    post:
      operationId: extractCvSkills
      tags: [career]
      summary: Extract dataset skills from an in-memory CV
      description: PDF, DOCX or UTF-8 TXT, at most 5 MB. No file or raw text is retained. No external services.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/CvUploadInput"
      responses:
        "200":
          description: Detected skills for user review, including an empty list if no skills were recognized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CvSkillExtraction"
        "400":
          description: Missing, malformed or unsupported file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: File or expanded document exceeds the processing limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: No readable text; scanned PDFs may require OCR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Extraction capacity is busy; retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /career/match:
    post:
      operationId: matchCareers
      tags: [career]
      summary: Rank role families by dataset skill overlap
      description: >
        Compares the supplied skills (normalized, exact-name matching) with each
        role family's 30 listed skills. Score = matched skills / 30 x 100.
        This is dataset skill overlap, not a probability of employment.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CareerSkillsInput"
      responses:
        "200":
          description: Ranked role families
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareerMatchResult"
        "400":
          description: Invalid skills input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List job listings
      parameters:
        - $ref: "#/components/parameters/JobPage"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobKeyword"
        - $ref: "#/components/parameters/JobMinimumSalary"
        - $ref: "#/components/parameters/JobMaximumSalary"
        - $ref: "#/components/parameters/JobState"
        - $ref: "#/components/parameters/JobCity"
        - $ref: "#/components/parameters/JobRemote"
        - $ref: "#/components/parameters/JobEmploymentType"
        - $ref: "#/components/parameters/JobSort"
      responses:
        "200":
          description: Paginated job listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/search:
    get:
      operationId: searchJobs
      tags: [jobs]
      summary: Search jobs by title, company, or skills
      parameters:
        - $ref: "#/components/parameters/JobPage"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobSearchKeyword"
        - $ref: "#/components/parameters/JobMinimumSalary"
        - $ref: "#/components/parameters/JobMaximumSalary"
        - $ref: "#/components/parameters/JobState"
        - $ref: "#/components/parameters/JobCity"
        - $ref: "#/components/parameters/JobRemote"
        - $ref: "#/components/parameters/JobEmploymentType"
        - $ref: "#/components/parameters/JobSort"
      responses:
        "200":
          description: Paginated matching listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          description: Invalid search filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/filter:
    get:
      operationId: filterJobs
      tags: [jobs]
      summary: Filter jobs by salary, location, and employment type
      parameters:
        - $ref: "#/components/parameters/JobPage"
        - $ref: "#/components/parameters/JobLimit"
        - $ref: "#/components/parameters/JobKeyword"
        - $ref: "#/components/parameters/JobMinimumSalary"
        - $ref: "#/components/parameters/JobMaximumSalary"
        - $ref: "#/components/parameters/JobState"
        - $ref: "#/components/parameters/JobCity"
        - $ref: "#/components/parameters/JobRemote"
        - $ref: "#/components/parameters/JobEmploymentType"
        - $ref: "#/components/parameters/JobSort"
      responses:
        "200":
          description: Paginated filtered listings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPage"
        "400":
          description: Invalid filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /jobs/match-score:
    post:
      operationId: calculateJobMatchScores
      tags: [jobs]
      summary: Calculate profile skill overlap for job listings
      description: Exact normalized skill-name overlap. This is not a hiring probability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobMatchInput"
      responses:
        "200":
          description: Match scores for the requested jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobMatchScores"
        "400":
          description: Invalid match request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  parameters:
    JobPage:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    JobLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    JobKeyword:
      name: q
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
    JobSearchKeyword:
      name: q
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 100
    JobMinimumSalary:
      name: minSalary
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    JobMaximumSalary:
      name: maxSalary
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
    JobState:
      name: state
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    JobCity:
      name: city
      in: query
      required: false
      schema:
        type: string
        maxLength: 80
    JobRemote:
      name: remote
      in: query
      required: false
      schema:
        type: boolean
    JobEmploymentType:
      name: employmentType
      in: query
      required: false
      schema:
        type: string
        enum: [full-time, part-time, contract, internship]
    JobSort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum: [relevance, recent]
        default: recent
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CvUploadInput:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
    CvSkillExtraction:
      type: object
      required: [skills, warnings]
      properties:
        skills:
          type: array
          items: { type: string }
        warnings:
          type: array
          items: { type: string }
    CareerSkillList:
      type: object
      properties:
        skills:
          type: array
          items:
            type: string
      required:
        - skills
    CareerSkillsInput:
      type: object
      properties:
        skills:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            maxLength: 60
      required:
        - skills
    CareerMatch:
      type: object
      properties:
        roleFamily:
          type: string
        score:
          type: number
          description: Matched skills / skills considered x 100, rounded to one decimal place.
        skillsConsidered:
          type: integer
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
      required:
        - roleFamily
        - score
        - skillsConsidered
        - matchedSkills
        - missingSkills
    CareerScoring:
      type: object
      properties:
        label:
          type: string
        formula:
          type: string
        note:
          type: string
      required:
        - label
        - formula
        - note
    CareerSource:
      type: object
      properties:
        datasetName:
          type: string
        publisher:
          type: string
        period:
          type: string
        license:
          type: string
        citation:
          type: string
        urls:
          type: array
          items:
            type: string
        intendedUse:
          type: string
        geographyNote:
          type: string
        measurementNote:
          type: string
      required:
        - datasetName
        - publisher
        - period
        - license
        - citation
        - urls
        - intendedUse
        - geographyNote
        - measurementNote
    CareerMatchResult:
      type: object
      properties:
        matches:
          type: array
          items:
            $ref: "#/components/schemas/CareerMatch"
        normalizedSkills:
          type: array
          items:
            type: string
        unrecognizedSkills:
          type: array
          items:
            type: string
        scoring:
          $ref: "#/components/schemas/CareerScoring"
        source:
          $ref: "#/components/schemas/CareerSource"
      required:
        - matches
        - normalizedSkills
        - unrecognizedSkills
        - scoring
        - source
    Job:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        company:
          type: string
        location:
          type: string
        state:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        remote:
          type: boolean
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        employmentType:
          type: string
          enum: [full-time, part-time, contract, internship]
        shortDescription:
          type: string
        description:
          type: string
        requiredSkills:
          type: array
          items:
            type: string
        externalUrl:
          type: ["string", "null"]
          format: uri
          pattern: "^https?://"
        datePosted:
          type: string
          format: date
        companyInfo:
          type: string
        demo:
          type: boolean
      required:
        - id
        - title
        - company
        - location
        - state
        - city
        - remote
        - salaryMin
        - salaryMax
        - employmentType
        - shortDescription
        - description
        - requiredSkills
        - externalUrl
        - datePosted
        - companyInfo
        - demo
    JobPage:
      type: object
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
      required: [jobs, page, limit, total, totalPages]
    JobMatchInput:
      type: object
      properties:
        candidateSkills:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 60
        jobIds:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
      required: [candidateSkills]
    JobMatchScore:
      type: object
      properties:
        jobId:
          type: string
        score:
          type: number
        matchedSkills:
          type: array
          items:
            type: string
        missingSkills:
          type: array
          items:
            type: string
        skillsConsidered:
          type: integer
      required: [jobId, score, matchedSkills, missingSkills, skillsConsidered]
    JobMatchScores:
      type: object
      properties:
        scores:
          type: array
          items:
            $ref: "#/components/schemas/JobMatchScore"
        scoringNote:
          type: string
      required: [scores, scoringNote]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

