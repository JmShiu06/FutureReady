[project]
name = "future-ready-learning-engine"
version = "0.1.0"
description = "Dataset-backed Skill Learning Recommendation Engine"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pandas>=2.2",
  "sentence-transformers>=6,<6.2",
  "chromadb>=1,<2",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "torch>=2.6",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
